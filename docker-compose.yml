services:
  postgres:
    image: postgres:16-alpine
    container_name: tourist-recommendation-db
    environment:
      POSTGRES_DB: tourism
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: tourism
    ports:
      - "5432:5432"
    volumes:
      - tourism-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tourism-postgres-data:
